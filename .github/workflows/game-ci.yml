name: River Valley Game CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
# Superseded PR heads should not compete for SwiftShader CPU and create
# artificial multi-minute rendering stalls in the scenario benchmark.
concurrency:
  group: river-valley-game-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser-game:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python HTML bundler dependency
        run: python -m pip install -r game/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q game
      - name: Validate GIS world intake and synthetic-data isolation
        run: python -m unittest discover -s game/tests -p test_gis_world_intake.py -v
      - name: Validate optional GLB gzip transport and rig-safe decoding
        run: python -m unittest discover -s game/tests -p test_optional_glb_compression.py -v
      - name: Verify optional Unreal editor art lab policies without Unreal Engine
        run: python -m unittest discover -s game/unreal-starter/tests -p 'test_*.py' -v
      - name: Rebuild independent offline and hosted game
        run: npm --prefix game run build
      - name: Validate gameplay, terrain, models and offline cache
        run: npm --prefix game test
      - name: Verify official Indiana GIS provenance, counts and coordinate tests
        run: |
          set -euo pipefail
          (cd game && python -m unittest discover -s tests -p test_reference_python.py -v)
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          from PIL import Image
          root=Path('game/reference/mount-vernon')
          meta=json.loads((root/'registration.json').read_text())
          roads=json.loads((root/'roads.geojson').read_text())['features']
          buildings=json.loads((root/'buildings.geojson').read_text())['features']
          assert meta['projection']=='EPSG:4326'
          assert meta['identifiedDowntownTileYear']=='2023'
          assert meta['roadLineCount']==len(roads)==709
          assert meta['buildingFootprintCount']==len(buildings)==4819
          assert meta['verticalDatumVerified'] is False
          assert meta['allStopCoordinatesSurveyVerified'] is False
          assert Image.open(root/'overhead.jpg').size==tuple(meta['imageDimensions'])
          for name,digest in json.loads((root/'SHA256SUMS.json').read_text()).items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest, f'Corrupt reference asset: {name}'
          assert Path('game/data/reference-bundle.js').stat().st_size>800_000
          print('PASS: 2023 downtown reference, 709 roads, 4,819 footprints, imagery provenance, checksums')
          PY
      - name: Audit runtime script and model dependencies before packaging
        run: |
          python game/tools/audit_runtime_graph.py
          python -m unittest discover -s game/tests -p test_runtime_graph.py -v
      - name: Verify bundled game is self-contained and complete
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          root=Path('game')
          html=root/'River_Valley_Family_Adventure_OFFLINE.html'
          soup=BeautifulSoup(html.read_text(),'html.parser')
          scripts=soup.find_all('script',src=True)
          assert not scripts, f'External script dependencies found: {scripts}'
          assert html.stat().st_size>2_000_000
          assert 'window.ValleyReference=' in html.read_text()
          assert len(list((root/'assets/models').glob('*.glb')))==6
          assert (root/'src/open-world.js').exists()
          assert (root/'docs/OPEN_WORLD_V1_7_RELEASE.md').exists()
          print('PASS: self-contained offline HTML, 6 GLBs, gameplay source and release evidence')
          PY
      - name: Install Chromium for real WebGL character tests
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Test playable 3D hero on desktop and phone-sized Chromium
        run: python game/tests/browser_hero_smoke.py
      - name: Capture controlled 24-condition world rendering matrix on SwiftShader
        run: python game/tests/browser_perf_matrix.py --frames 18 --output /tmp/river-hero-visual-qa/perf-matrix.json
      - name: Prove fully offline gameplay and save-slot replay in Chromium
        run: python game/tests/offline_pwa_smoke.py --site-dir game --entry game.html
      - name: Preserve real browser screenshots and pose-inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: river-valley-hero-browser-evidence
          path: /tmp/river-hero-visual-qa/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: river-valley-offline-game
          path: |
            game/River_Valley_Family_Adventure_OFFLINE.html
            game/assets/models/river_explorer_rigged.glb
            game/assets/models/river_explorer_manifest.json
            game/docs/OPEN_WORLD_V1_7_RELEASE.md
            game/docs/MOUNT_VERNON_GEOREFERENCE_V1_8.md
            game/reference/mount-vernon/digitized-overview.png
            game/docs/v17-inworld-browser-verified.png
          if-no-files-found: error
