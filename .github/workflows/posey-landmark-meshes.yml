name: Rebuild Posey courthouse and source-derived landmark placement
on:
  push:
    branches:
      - feat/mount-vernon-landmark-meshes-and-character-gate-20261123
    paths:
      - .github/workflows/posey-landmark-meshes.yml
      - game/build_models.py
      - game/tools/posey_courthouse_mesh.py
      - game/tools/build_landmark_anchors.py
      - game/tests/test_posey_courthouse_mesh.py
      - game/tests/test_landmark_anchors.py
      - game/tests/test-courthouse-contract.cjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: posey-landmark-meshes
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reproducible geometry toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r game/requirements.txt 'trimesh==4.11.1' 'numpy==2.3.5'
      - name: Validate exact courthouse source polygon and architecture test
        run: |
          python -m unittest discover -s game/tests -p 'test_landmark_anchors.py' -v
          python -m unittest discover -s game/tests -p 'test_posey_courthouse_mesh.py' -v
          node --test game/tests/test-building-roofs.cjs
      - name: Generate the mesh, official horizontal anchor, and provenance receipt
        run: |
          python game/build_models.py
          python game/tools/build_landmark_anchors.py
      - name: Rebuild hosted and standalone offline release
        run: |
          npm --prefix game run build
          npm --prefix game test
          node --test game/tests/test-courthouse-contract.cjs
          python game/tools/audit_runtime_graph.py
          python -m unittest discover -s game/tests -p 'test_pages_build.py' -v
          python game/tools/build_pages.py --output _site
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: courthouse-source-geometry-and-game
          path: |
            game/assets/models/courthouse.glb
            game/assets/models/MANIFEST.json
            game/data/models.js
            game/data/landmark-anchors.js
            game/reference/mount-vernon/landmark-anchors-receipt.json
            _site/index.html
          retention-days: 14
      - name: Commit tested source-derived game assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/assets/models/MANIFEST.json game/assets/models/*.glb \
            game/data/models.js game/data/landmark-anchors.js \
            game/reference/mount-vernon/landmark-anchors-receipt.json \
            game/game.html game/River_Valley_Family_Adventure_OFFLINE.html
          if git diff --cached --quiet; then
            echo 'Source-derived game assets already match generated binaries'
          else
            git commit -m 'assets(game): build source-anchored Posey courthouse and roof meshes'
            git pull --rebase origin feat/mount-vernon-landmark-meshes-and-character-gate-20261123
            git push origin HEAD:feat/mount-vernon-landmark-meshes-and-character-gate-20261123
          fi
