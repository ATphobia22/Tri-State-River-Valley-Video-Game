name: Issue 64 pinned geographic streaming lockfile
on:
  push:
    branches: [feat/issue-64-official-geostream]
    paths:
      - 'game/package.json'
      - '.github/workflows/issue64-geostream-lock.yml'
permissions:
  contents: write
jobs:
  pin-lock:
    if: github.repository == 'ATphobia22/Tri-State-River-Valley-Video-Game'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and validate package-lock using exact package pins
        run: |
          cd game
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --depth=0
      - name: Commit generated lockfile to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: resolve SHA-integrity streaming dependency lockfile (#64)'
            git push origin HEAD:refs/heads/feat/issue-64-official-geostream
          fi
