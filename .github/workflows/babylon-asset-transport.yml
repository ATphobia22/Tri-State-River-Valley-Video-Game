name: Babylon verified asset transport
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test integrity-verified asset requests and HTTP range safety
        run: node --test game/tests/test-babylon-asset-transport.cjs
