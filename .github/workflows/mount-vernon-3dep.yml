name: Acquire and package Mount Vernon USGS 3DEP game terrain
on:
  push:
    branches:
      - feat/mount-vernon-3dep-open-world-20261123
    paths:
      - .github/workflows/mount-vernon-3dep.yml
      - game/tools/acquire_3dep_terrain.py
      - game/tests/test_3dep_terrain_python.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mount-vernon-3dep-source-snapshot
  cancel-in-progress: false

jobs:
  digitize:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source processing and game dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r game/requirements.txt 'rasterio==1.4.3'
      - name: Verify pure admission tests before import
        run: |
          node --test game/tests/test-terrain-source.cjs
          python -m unittest discover -s game/tests -p test_3dep_terrain_python.py -v
      - name: Download raw USGS 3DEP elevation and generate validated offline grid
        run: |
          python game/tools/acquire_3dep_terrain.py \
            --out game/data/usgs-3dep-terrain.js \
            --receipt game/reference/mount-vernon/usgs-3dep-receipt.json
      - name: Re-validate source-built game
        run: |
          node --test game/tests/test-terrain-source.cjs
          npm --prefix game run build
          python game/tools/audit_runtime_graph.py
          python -m unittest discover -s game/tests -p test_runtime_graph.py -v
          python -m unittest discover -s game/tests -p test_pages_build.py -v
          python game/tools/build_pages.py --output _site
          git diff --check
      - name: Save independent source and binary packaging artifact
        uses: actions/upload-artifact@v4
        with:
          name: mount-vernon-usgs-3dep-offline-source
          path: |
            game/data/usgs-3dep-terrain.js
            game/reference/mount-vernon/usgs-3dep-receipt.json
            _site/index.html
            _site/offline.html
          retention-days: 14
      - name: Commit validated snapshot back to the feature branch only
        if: github.ref == 'refs/heads/feat/mount-vernon-3dep-open-world-20261123'
        env:
          BRANCH: feat/mount-vernon-3dep-open-world-20261123
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/data/usgs-3dep-terrain.js \
            game/reference/mount-vernon/usgs-3dep-receipt.json \
            game/game.html game/River_Valley_Family_Adventure_OFFLINE.html
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
          else
            git commit -m 'assets(game): admit USGS 3DEP Mount Vernon terrain snapshot'
            git push origin "HEAD:${BRANCH}"
          fi
