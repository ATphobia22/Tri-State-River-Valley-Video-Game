name: Independent live Babylon Pages acceptance
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy River Valley Family Adventure to GitHub Pages"]
    types: [completed]
permissions:
  contents: read
jobs:
  live-qa:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium smoke-test runtime
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Independently test deployed public HTTPS page
        run: python game/tests/browser_live_babylon_qa.py --output /tmp/river-live-babylon
      - name: Upload live-site screenshots and JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: river-valley-live-pages-browser-evidence
          path: /tmp/river-live-babylon/
          if-no-files-found: warn
