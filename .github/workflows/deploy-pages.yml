name: Deploy River Valley Family Adventure to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'auto-3d-city-builder/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Pull-request validation must never displace a queued production deployment.
  group: river-valley-github-pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install game HTML builder dependencies
        run: python -m pip install -r game/requirements.txt
      - name: Build self-contained hosted and downloadable offline game
        run: npm --prefix game run build
      - name: Check lossless optional GLB transport integrity
        run: python -m unittest discover -s game/tests -p test_optional_glb_compression.py -v
      - name: Validate gameplay and geometry
        run: npm --prefix game test
      - name: Audit self-contained game asset graph
        run: |
          python game/tools/audit_runtime_graph.py
          python -m unittest discover -s game/tests -p test_runtime_graph.py -v
      - name: Test Pages-root packaging, offline download and disabled workers
        run: python -m unittest discover -s game/tests -p test_pages_build.py -v
      - name: Build source-linked Mount Vernon regional zoning scene
        run: |
          npm --prefix game/valley-scene ci
          npm --prefix game/valley-scene run build
      - name: Package playable game at website root
        run: python game/tools/build_pages.py --output _site
      - name: Test online-first runtime contract
        run: python -m unittest discover -s game/tests -p test_online_first.py -v
      - name: Verify deployed payload before publishing
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json
          p=Path('_site')
          html=(p/'index.html').read_text()
          assert len(html)>2_000_000
          assert 'window.ValleyReference=' in html
          assert 'serviceWorker.register(' not in html
          assert 'serviceWorker.getRegistrations()' in html
          assert 'registration.unregister()' in (p/'game-sw.js').read_text()
          assert (p/'game.html').read_bytes() == (p/'index.html').read_bytes()
          assert (p/'offline.html').stat().st_size>2_000_000
          manifest=json.loads((p/'game.webmanifest').read_text())
          assert manifest['start_url']=='./'
          assert all(not a['src'].startswith('http') for a in manifest['icons'])
          print('PASS: playable root, standalone offline download, no service worker and local assets')
          PY
      - name: Install Chromium for real WebGL character tests
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Test playable 3D hero on desktop and phone-sized Chromium
        run: python game/tests/browser_hero_smoke.py
      - name: Verify Pages game has no worker and preserves local saves on online reload
        run: python game/tests/service_worker_disabled_smoke.py --site-dir _site --entry index.html
      - name: Preserve real browser screenshots and pose-inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: river-valley-hero-browser-evidence
          path: /tmp/river-hero-visual-qa/
          if-no-files-found: warn
      - name: Preserve the playable Pages site even when Pages has not been enabled yet
        uses: actions/upload-artifact@v4
        with:
          name: river-valley-pages-site
          path: _site/
          include-hidden-files: true
          if-no-files-found: error
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified game
        id: deployment
        uses: actions/deploy-pages@v4
