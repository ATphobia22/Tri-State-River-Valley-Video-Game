<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>River Valley — Babylon WebGL2 Engine Preview</title>
<style>
html,body{height:100%;margin:0;background:#0d242a;color:#eff5e5;font:15px system-ui}
#babylon-world{display:block;width:100%;height:100%;touch-action:none}
aside{position:fixed;top:12px;left:12px;padding:14px;background:#0c2530e8;border:1px solid #b9ceae60;border-radius:12px;max-width:330px}
label{display:block;margin:8px 0}select{background:#153b40;color:white;padding:5px;border-radius:6px}#status{font-size:12px;color:#d9e5c5}
#adventure-status{display:block;margin:8px 0;font-size:12px;color:#d9e5c5}#actions{position:fixed;bottom:14px;left:14px;display:flex;flex-wrap:wrap;gap:8px;max-width:95vw;z-index:2}#actions button{min-width:45px;min-height:45px;background:#153b40;color:#fff;border:1px solid #a8c7a677;border-radius:7px;touch-action:none}#actions button:disabled{opacity:.55}aside{z-index:2}</style></head><body>
<canvas id="babylon-world" aria-label="WebGL2 Babylon engine preview"></canvas>
<aside><strong>River Valley · WebGL2 migration preview</strong>
<label>Graphics quality <select id="quality"><option>low</option><option selected>medium</option><option>high</option><option>ultra</option><option>cinematic</option></select></label>
<p id="status" role="status">Initializing WebGL2...</p>
<small>Illustrative geometry only. No unregistered geographic tiles are displayed.</small><p id="hero-status" role="status">Loading verified project-original River Explorer…</p><p id="adventure-status" role="status">Loading gameplay...</p><small>Illustrative game world. No unregistered geographic tiles are displayed.</small></aside>
<div id="actions" aria-label="Mobile game controls"><button data-move="left" aria-label="Walk left">◀</button><button data-move="forward" aria-label="Walk forward">▲</button><button data-move="back" aria-label="Walk backward">▼</button><button data-move="right" aria-label="Walk right">▶</button><button data-move="sprint" aria-label="Sprint">Run</button><button id="discover-waypoint">Discover</button><button id="cycle-time">Day/Night</button></div>
<script type="module" src="./babylon-preview/main.js"></script></body></html>
